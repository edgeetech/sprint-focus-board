<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint Focus Board</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* Font pairing: ?font=redhat|archivo (remembered). */
(function(){
  var F={
    redhat:{css:'family=Red+Hat+Display:wght@300;400;500;600;700&family=Red+Hat+Text:wght@400;500;600',data:'"Red Hat Display"',body:'"Red Hat Text"'},
    archivo:{css:'family=Archivo:wdth,wght@62..125,200..800',data:'"Archivo"',body:'"Archivo"'}
  };
  var k='redhat',p=new URLSearchParams(location.search).get('font');
  try{if(p&&F[p])localStorage.setItem('sfb.font',JSON.stringify(p));k=JSON.parse(localStorage.getItem('sfb.font')||'"redhat"')}catch(e){if(p)k=p}
  if(!F[k])k='redhat';
  var f=F[k],s=document.documentElement.style;document.documentElement.dataset.font=k;
  s.setProperty('--f-data',f.data+',system-ui,sans-serif');s.setProperty('--f-body',f.body+',system-ui,sans-serif');
  var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+f.css+'&display=swap';document.head.appendChild(l);
})();
</script>
<style>
/* Porcelain HUD: a light instrument surface. Frosted panels float over a slow light field;
   the sprint's open tickets drift past behind them and a scan line sweeps the board. */
:root{
  --porcelain:#ECEFF3; --mist:#E3E8EF; --hair:#D3D9E2; --hair-2:#C3CBD6;
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55);
  --ink:#141A2B; --ink-2:#4A5367; --ink-3:#8A93A6;
  --cobalt:#2343FF; --cobalt-soft:rgba(35,67,255,.08);
  --p1:#E5484D; --p2:#D9822B; --p3:#2343FF; --p4:#2F9E6A; --p5:#8E6CF0; --p0:#8A93A6;
  --float:0 24px 36px -24px rgba(20,30,70,.34),0 1px 2px rgba(20,30,70,.06);
  color-scheme:light;
}
html[data-font="archivo"]{--stretch:118%}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;font:14px/1.42 var(--f-body);background:var(--porcelain);color:var(--ink);
  font-feature-settings:"tnum" 1,"lnum" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
svg{flex:none;display:block}
.disp,.me b,.spr b,.bay h2,.bay .n,.pn,.key,.seg button{font-family:var(--f-data);font-stretch:var(--stretch,100%)}

/* ambient layers */
.field{position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(35,67,255,.10),transparent 72%) 18% 22%/48% 52% no-repeat,
             radial-gradient(closest-side,rgba(70,190,255,.12),transparent 72%) 78% 64%/44% 48% no-repeat,
             radial-gradient(closest-side,rgba(150,120,255,.07),transparent 72%) 52% 92%/40% 40% no-repeat;
  animation:field 38s ease-in-out infinite alternate}
@keyframes field{to{transform:translate(6%,-5%) rotate(6deg)}}
.traffic{position:fixed;inset:56px 0 0 0;overflow:hidden;pointer-events:none;z-index:0}
.lane{position:absolute;left:0;white-space:nowrap;font:400 11px/1 var(--f-data);letter-spacing:.09em;color:rgba(20,26,43,.065);
  will-change:transform;animation:drift var(--d,120s) linear infinite}
.lane.far{font-size:9.5px;filter:blur(.8px);color:rgba(20,26,43,.045)}
.lane span{margin-right:5em}
.lane .mine{color:rgba(35,67,255,.26)}
@keyframes drift{to{transform:translateX(-50%)}}

/* top bar */
.top{position:relative;z-index:4;flex:none;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;
  background:var(--glass-2);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:.5px solid var(--hair-2)}
.people{display:flex;align-items:center;position:relative}
.av-btn{margin-left:-7px;border:2px solid #fff;border-radius:50%;padding:0;background:#fff;cursor:pointer;position:relative;box-shadow:0 1px 3px rgba(20,30,70,.15)}
.av-btn:first-child{margin-left:0}
.av-btn:hover{z-index:2}
.av-btn[aria-pressed="true"]{border-color:var(--cobalt);z-index:3}
.av{width:28px;height:28px;border-radius:50%;display:block;object-fit:cover;background:var(--mist)}
.av.ini{display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--mist)}
.more-btn{margin-left:-7px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:var(--mist);color:var(--ink-2);font-size:11.5px;font-weight:600;cursor:pointer}
.me{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.me b{font-size:18px;font-weight:500;letter-spacing:-.01em}
.me i{font-style:normal;font-size:12px;font-weight:600;color:var(--cobalt)}
.sep{width:.5px;height:24px;background:var(--hair-2);flex:none}
.spr{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none;color:var(--ink-2);font-size:13px}
.spr b{font-weight:500;font-size:14px;color:var(--ink)}
.spr em{font-style:normal;font-family:var(--f-data);font-weight:300;font-size:20px;color:var(--cobalt);line-height:1}
.tape{display:flex;gap:2px;align-items:flex-end}
.tape i{width:6px;height:13px;border-radius:1.5px;box-shadow:inset 0 0 0 .5px var(--hair-2);background:rgba(255,255,255,.6)}
.tape i.we{width:3px;height:9px;opacity:.7}
.tape i.past{background:var(--ink-3);box-shadow:none;opacity:.55}
.tape i.today{background:var(--cobalt);box-shadow:0 0 8px rgba(35,67,255,.5);height:17px}
.grow{flex:1}
.search{position:relative;width:250px;min-width:110px;flex:0 1 250px}
.search input{width:100%;height:34px;border:.5px solid var(--hair-2);background:rgba(255,255,255,.7);border-radius:8px;padding:0 28px 0 32px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.search svg{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.search kbd{position:absolute;right:8px;top:8px;font:11px/17px var(--f-body);color:var(--ink-3);border:.5px solid var(--hair-2);border-radius:4px;padding:0 5px;background:#fff}
.tb{height:34px;display:inline-flex;align-items:center;gap:6px;border:.5px solid var(--hair-2);background:rgba(255,255,255,.6);border-radius:8px;padding:0 11px;
  color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:13px;flex:none}
.tb:hover{color:var(--ink);background:#fff}
.tb[aria-pressed="true"]{color:var(--cobalt);border-color:var(--cobalt);background:#fff}
.tb:disabled{opacity:.45;cursor:default;background:transparent}
.seg{display:inline-flex;border:.5px solid var(--hair-2);border-radius:8px;overflow:hidden;height:34px;background:rgba(255,255,255,.6);flex:none}
.seg button{border:0;background:none;color:var(--ink-3);padding:0 10px;cursor:pointer;font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chan{flex:none}
.chan button+button{border-left:.5px solid var(--hair-2)}
.chan button[aria-pressed="true"]+button[aria-pressed="true"]{border-left-color:rgba(255,255,255,.18)}
.chan button{display:inline-flex;align-items:center;gap:6px}
.chan button i{width:6px;height:6px;border-radius:50%;background:var(--hair-2);font-style:normal}
.chan button[aria-pressed="true"] i{background:var(--dot,#fff)}
.burnw{position:relative;flex:none;display:flex;align-items:center;gap:8px;margin-left:28px}
.burnl{color:var(--ink-2);font-size:13px;white-space:nowrap}
.burn{--lv:var(--ink-3)}
.burn.low{--lv:var(--p1)}
.burn.mid{--lv:var(--p2)}
.burn.ok{--lv:var(--p4)}
/* fitTop() adds c1..c7 in turn while the header does not fit; the order is the order space is given up.
   If it still does not fit, "wrap" moves the rest to a second row. */
.top.c1 .burnl{display:none}.top.c1 .burnw{margin-left:12px}
.top.c2 #motion span{display:none}
.top.c3 #settings span{display:none}
.top.c4 .search kbd{display:none}.top.c4 .search{min-width:80px}
.top.c5 .spr .left{display:none}
.top.c6 #stamp{display:none}
.top.c7 #hiddenBtn span{display:none}
.top.wrap{height:auto;flex-wrap:wrap;padding:6px 18px;row-gap:0}
.top.wrap>*{margin-top:5px;margin-bottom:5px}
/* The spacer becomes a zero-height line break, so search and the buttons move down together, on the right. */
.top.wrap .grow{flex:0 0 100%;height:0;margin:0}.top.wrap .search{margin-left:auto}
.top.wrap.joined .grow{display:none}
.burn b{font-family:var(--f-data);font-weight:500;color:var(--lv);font-size:14px}
.burn small{color:var(--ink-3);font-size:11.5px}
.burn .bar{width:46px;height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
.burn .bar i{display:block;height:100%;width:var(--w);background:var(--lv)}
.bpop{position:absolute;top:42px;right:0;z-index:20;width:450px;max-height:480px;overflow:auto;overflow-x:hidden;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border:.5px solid var(--hair-2);border-radius:10px;box-shadow:var(--float);padding:8px 10px;font-size:12.5px;color:var(--ink-2)}
.bpop[hidden]{display:none}
.bpop p{margin:2px 0 6px;line-height:1.4}
.bpop h4{display:flex;justify-content:space-between;margin:10px 0 2px;font-size:12px;font-weight:600;color:var(--ink)}
.bpop h4 span{font-family:var(--f-data);font-weight:500}
.burn svg{color:var(--lv)}
.spark{position:relative;display:flex;gap:4px;align-items:flex-end;height:40px;margin:8px 0 18px}
.spark i{position:relative;flex:1;min-height:2px;border-radius:3px 3px 0 0;background:var(--hair-2);font-style:normal}
.spark i.low{background:var(--p1)}.spark i.mid{background:var(--p2)}.spark i.ok{background:var(--p4)}
.spark i span{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-3)}
.spark b{position:absolute;left:0;right:0;border-top:1px dashed var(--ink-3);opacity:.5;pointer-events:none}
.bpop table{width:100%;border-collapse:collapse}
.bpop td{padding:5px 3px;border-top:.5px solid var(--hair);white-space:nowrap}
.burn .lgb{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding-left:9px;border-left:.5px solid var(--hair);color:var(--ink-2)}
.burn .lgb svg{width:14px;height:14px}
.burn .lgb b{color:var(--ink)}
.bpop .lgd{display:flex;align-items:center;gap:8px;padding:2px 2px 10px;margin-bottom:4px;border-bottom:.5px solid var(--hair);color:var(--ink-2)}
.bpop .lgd b{font-size:20px;font-weight:600;color:var(--ink);font-family:var(--f-data)}
.bpop .lgd span{font-size:12px}
.bpop th{padding:4px 3px 3px;font-size:10.5px;font-weight:500;color:var(--ink-3);text-align:left}
.bpop th.hr{text-align:right}
.bpop .lgc{text-align:center}
.bpop .lgp{display:inline-flex;align-items:center;gap:3px;padding:1px 7px 1px 5px;border-radius:999px;background:#E9F0FF;color:#2F5BD3;font-family:var(--f-data);font-size:11.5px}
.bpop .lgp svg{width:11px;height:11px}
.bpop .bc2{padding-left:10px!important;border-left:.5px solid var(--hair);font-weight:600}
.bpop table.mt td{vertical-align:top;line-height:1.45}
.bpop table.mt td:nth-child(4){white-space:normal;font-size:11.5px;min-width:84px}
.bpop table.mt td:nth-child(2){color:var(--ink-3);font-family:var(--f-data)}
.bpop .z{color:var(--ink-3)}
.bpop td.hr{text-align:right;font-family:var(--f-data);color:var(--ink)}
.bpop tr.z td{color:var(--ink-3)}
.bpop a{color:var(--cobalt);text-decoration:none;font-family:var(--f-data)}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{position:absolute;top:42px;left:0;z-index:20;width:270px;max-height:360px;overflow:auto;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
  border:.5px solid var(--hair-2);border-radius:10px;box-shadow:var(--float);padding:6px}
.pop[hidden]{display:none}
.pop input{width:100%;height:32px;border:.5px solid var(--hair-2);border-radius:6px;padding:0 9px;margin-bottom:4px;background:#fff}
.pop button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:5px 6px;border-radius:6px;cursor:pointer;text-align:left}
.pop button:hover,.pop button[aria-pressed="true"]{background:var(--cobalt-soft)}
.pop .av{width:24px;height:24px}
.err{position:relative;z-index:4;flex:none;display:flex;gap:12px;align-items:center;padding:9px 18px;background:#FDECEC;color:#7A1C1F;font-size:13px;border-bottom:.5px solid #F3C4C5}
.err[hidden]{display:none}
.err button{margin-left:auto}

/* bays */
.bays{position:relative;z-index:1;flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent}
.bay{flex:1 1 310px;min-width:310px;max-width:420px;display:flex;flex-direction:column;min-height:0;border-right:.5px solid var(--hair-2);scroll-snap-align:start}
.bh{flex:none;padding:16px 16px 12px;background:linear-gradient(rgba(236,239,243,.86),rgba(236,239,243,.55));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bh-r{display:flex;align-items:baseline;gap:8px}
.bay h2{margin:0;font-size:16px;line-height:1.15;font-weight:500;letter-spacing:-.005em;position:relative}
.bay h2:after{content:"";position:absolute;left:0;bottom:-6px;width:18px;height:2px;border-radius:2px;background:var(--sc)}
.bay .n{font-size:18px;font-weight:300;color:var(--ink-3)}
.bay .held-n{font-size:12px;color:var(--ink-3)}
.fold{margin-left:auto;align-self:center;border:0;background:none;color:var(--ink-3);cursor:pointer;width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.fold:hover{color:var(--ink);background:rgba(255,255,255,.7)}
.rule{margin-top:12px;font-size:12px;line-height:1.35;color:var(--ink-3)}
.slot{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent}
.empty{border:.5px dashed var(--hair-2);border-radius:8px;padding:16px 12px;color:var(--ink-3);font-size:13px}
.bay.folded{flex:0 0 48px;min-width:48px;cursor:pointer;background:rgba(255,255,255,.25)}
.bay.folded .bh{height:100%;padding:12px 0;display:flex;flex-direction:column;align-items:center}
.bay.folded .bh-r{flex-direction:column;align-items:center;gap:12px}
.bay.folded .fold{margin:0;order:-1}
.bay.folded h2{writing-mode:vertical-rl;transform:rotate(180deg);font-size:14px;white-space:nowrap}
.bay.folded h2:after{display:none}
.bay.folded .n{font-size:15px}
.bay.folded .rule,.bay.folded .slot,.bay.folded .held-n{display:none}
.bay.vacant{cursor:default}
.bay.vacant h2,.bay.vacant .n{color:var(--ink-3)}

/* card: frosted plate floating above the field */
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--glass);
  backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border:.5px solid var(--hair);border-top-color:#fff;border-radius:8px;box-shadow:var(--float);padding:12px 12px 10px 15px;
  transition:opacity .18s ease,transform .18s ease}
.card:hover{border-color:var(--hair-2);border-top-color:#fff}
.card.held{opacity:.5;border-style:dashed;box-shadow:none;background:rgba(255,255,255,.35)}
.card.leaving{opacity:0;transform:translateY(-6px) scale(.98)}
.card.arrive{animation:arrive 1.3s cubic-bezier(.2,.7,.2,1)}
@keyframes arrive{0%{opacity:0;transform:translateY(-10px);box-shadow:0 0 0 2px var(--cobalt),var(--float)}35%{opacity:1;transform:none;box-shadow:0 0 0 2px var(--cobalt),var(--float)}}
.pv{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 2px;border-radius:999px;background:color-mix(in srgb,var(--pc) 8%,#fff);
  box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--pc) 28%,transparent)}
.pi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,#fff)}
.pi svg{width:15px;height:15px}
.pl{font-size:12px;line-height:1;font-weight:600;color:var(--pc)}
.pv.p1 .pi svg{transform-origin:50% 85%;animation:flicker 1.9s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.07,.95) rotate(-3deg)}60%{transform:scale(.96,1.06) rotate(2deg)}}
.blk{flex:none;height:24px;display:inline-flex;align-items:center;gap:3px;padding:0 8px 0 6px;border-radius:999px;font-size:12px}
.blk svg{width:15px;height:15px}
.blk b{font-weight:700}
.blk.bc{position:relative;width:26px;padding:0;justify-content:center;margin:0 6px 0 2px;border:0;font:inherit;cursor:pointer;color:#E0482A;background:#FFEAE3;border-radius:8px;transition:background .15s ease}
.blk.bc svg{width:17px;height:17px}
.blk.bc b{position:absolute;top:-6px;right:-7px;min-width:15px;height:15px;padding:0 4px;box-sizing:border-box;border-radius:999px;display:grid;place-items:center;background:#E0482A;color:#fff;font-size:9.5px;line-height:1;box-shadow:0 0 0 1.5px #fff}
.blk.bc:hover,.blk.bc[aria-expanded="true"]{background:#FFD8CB}
.bkp{position:fixed;z-index:40;width:340px;max-height:320px;overflow:auto;padding:10px 6px 6px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  border-radius:14px;box-shadow:0 0 0 .5px rgba(255,139,105,.45),0 12px 32px rgba(30,20,20,.16);font-size:12px;animation:bkin .14s ease-out}
.bkp[hidden]{display:none}
@keyframes bkin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.bkp h4{display:flex;align-items:center;gap:6px;margin:0 8px 6px;font-size:11.5px;font-weight:600;color:#E0482A}
.bkp h4 svg{width:13px;height:13px}
.bki{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink)}
.bki:hover,.bki:focus-visible{background:#FFF0EA;outline:none}
.bki .k{font-weight:700;letter-spacing:.03em;color:var(--cobalt);white-space:nowrap}
.bki .st{justify-self:end;padding:1px 7px;border-radius:999px;font-size:10.5px;white-space:nowrap;color:#4A5367;background:#EEF0F4}
.bki .st.indeterminate{color:#1D4ED8;background:#E6EEFF}
.bki .sm{grid-column:1/-1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{min-width:0}
.r1{display:flex;align-items:center;gap:7px;min-width:0}
.key{font-size:13.5px;font-weight:700;letter-spacing:.04em;color:var(--cobalt);text-decoration:none;white-space:nowrap}
.key:hover{text-decoration:underline;text-underline-offset:2px}
.ty-l{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.tyi{width:16px;height:16px;flex:none;border-radius:3px;display:block;color:var(--ink-3)}
.as{margin-left:auto;flex:none;display:block}
.as .av,.as .none{width:22px;height:22px}
.as .av.ini{font-size:9px}
.as .none{display:block;border-radius:50%;border:1px dashed var(--hair-2)}
.card h3{margin:5px 0 0;font-size:14px;line-height:1.38;font-weight:500;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.last{display:inline-flex;margin-left:8px}
.last svg{overflow:hidden}
/* Each cloth column lifts and leans a little later than the one before, so the flags ripple away from the poles. */
.last .fc{transform-box:fill-box;transform-origin:left center;animation:wave .9s ease-in-out infinite;animation-delay:calc(var(--i)*-.14s)}
.last .fc rect:first-child{stroke:#2B2B2B;stroke-width:.3}
@keyframes wave{0%,100%{transform:translateY(calc(var(--i)*-.45px)) skewY(8deg)}50%{transform:translateY(calc(var(--i)*.45px)) skewY(-8deg)}}
.par{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:12px;color:var(--ink-3);min-width:0}
.par span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:.5px solid var(--hair)}
/* hand-off chain: Assignee -> each reviewer role; the stage the ticket is in sits on a soft pill */
.chain{display:flex;flex-direction:column;align-items:center;margin-left:10px;padding-left:9px;border-left:.5px solid var(--hair)}
.grp{display:flex;flex-direction:column;align-items:center;padding:3px;border-radius:999px;transition:background .2s ease}
.grp>*{margin-top:-7px}.grp>:first-child{margin-top:0}
.grp .av{width:22px;height:22px;box-shadow:0 0 0 1.5px #fff}
.grp .av.ini{font-size:9px}
.grp .none{display:block;width:22px;height:22px;border-radius:50%;border:1px dashed var(--ink-3);background:rgba(255,255,255,.6)}
.grp .you{box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--cobalt)}
.grp.now{background:var(--cobalt-soft)}
.grp.next{opacity:.5}
.link{position:relative;width:1px;height:10px;margin:2px 0;color:var(--hair-2);background:currentColor;flex:none}
.link:after{content:"";position:absolute;bottom:0;left:-1.5px;width:4px;height:4px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg)}
.link.done{color:var(--cobalt)}
.tag{font-size:11.5px;font-weight:500;color:var(--ink-2);border:.5px solid var(--hair-2);border-radius:999px;padding:1px 9px;white-space:nowrap;background:rgba(255,255,255,.6)}
.tag.open{border-style:dashed;color:var(--ink-3)}
.tag.you{border-color:var(--cobalt);color:var(--cobalt)}
.acts{margin-left:auto;display:flex;align-items:center;gap:2px}
.acts button{border:0;background:none;cursor:pointer;height:28px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);padding:0 7px}
.acts button:hover{background:var(--cobalt-soft);color:var(--ink)}
.acts .copy{color:var(--cobalt);font-weight:600;font-size:12.5px}
.acts .copy.ok{background:var(--cobalt);color:#fff}

.skel{height:110px;border-radius:8px;background:rgba(255,255,255,.55);border:.5px solid var(--hair)}

/* refresh show */
.show{position:fixed;inset:0;z-index:40;background:rgba(236,239,243,.3);opacity:0;transition:opacity .3s ease;cursor:pointer;overflow:hidden}
.show.on{opacity:1}
.show .ground{position:absolute;left:0;right:0;height:.5px;background:var(--hair-2)}
.worker{position:absolute;left:0;top:0;width:80px;height:120px;will-change:transform;filter:drop-shadow(0 10px 8px rgba(20,30,70,.18))}
.worker .flip{width:80px;height:120px;transform-origin:40px 120px}
.worker svg{display:block;overflow:visible}
.worker .leg,.worker .arm,.worker .body,.worker .eyes,.worker .head{transform-box:view-box}
.worker .leg{transform-origin:40px 80px;transition:transform .25s ease}
.worker .arm{transform-origin:40px 52px;transition:transform .2s ease}
.worker .arm.f{transform:rotate(-24deg)}
.worker .body{transform-origin:40px 80px;transition:transform .2s ease}
.worker .head{transform-origin:40px 42px}
.worker .eyes{transform-origin:46px 31px;animation:blink 3.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.worker.walk .body{animation:bob .21s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.worker.walk .leg.l{animation:legA .42s ease-in-out infinite alternate}
.worker.walk .leg.r,.worker.walk .arm.b{animation:legB .42s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes legB{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.worker.dig .body{transform:rotate(36deg) translateY(4px)}
.worker.dig .arm.b{animation:dig .24s ease-in-out infinite alternate}
.worker.dig .head{animation:peer .48s ease-in-out infinite alternate}
@keyframes dig{from{transform:rotate(-38deg)}to{transform:rotate(18deg)}}
@keyframes peer{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.worker.sit .leg.l{transform:rotate(-84deg)}.worker.sit .leg.r{transform:rotate(-70deg)}
.worker.sit .arm.f{transform:rotate(-58deg)}
.worker.throw .arm.b{animation:throw .34s ease-out}
@keyframes throw{0%{transform:rotate(0)}40%{transform:rotate(165deg)}100%{transform:rotate(-35deg)}}
.crate{position:absolute;left:0;top:0;width:130px;height:96px;transform-origin:65px 96px;transition:opacity .35s ease,transform .35s ease}
.crate svg{display:block;overflow:visible}
.crate.busy{animation:shake .26s ease-in-out infinite alternate}
@keyframes shake{from{rotate:-1.4deg}to{rotate:1.4deg}}
.crate.gone{opacity:0;transform:translateY(12px) scale(.94)}
.tk{position:absolute;left:0;top:0;width:30px;height:20px;border-radius:3px;background:#fff;border:.5px solid var(--hair-2);
  box-shadow:inset 2.5px 0 0 var(--tc),0 6px 10px -5px rgba(20,30,70,.4);will-change:transform}
.tk:after{content:"";position:absolute;left:8px;right:6px;top:6px;height:2px;border-radius:2px;background:var(--hair-2);box-shadow:0 5px 0 var(--hair)}
.bays.landing .card:not(.landed){visibility:hidden}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;
  padding:10px 14px 10px 16px;border-radius:10px;box-shadow:0 18px 40px -12px rgba(20,26,43,.5);display:flex;gap:14px;align-items:center;font-size:13.5px;
  transition:opacity .16s ease,transform .16s ease;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#9DB0FF;font-weight:700;cursor:pointer;padding:2px 4px}

/* setup wizard */
.setup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(236,239,243,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.setup[hidden]{display:none}
.su{width:min(980px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:rgba(255,255,255,.94);border:.5px solid var(--hair-2);
  border-radius:14px;box-shadow:0 40px 80px -30px rgba(20,30,70,.45),0 1px 2px rgba(20,30,70,.08)}
.su-top{flex:none;padding:20px 24px 14px;border-bottom:.5px solid var(--hair)}
.su-top h2{margin:0;font:500 21px/1.2 var(--f-data);letter-spacing:-.01em}
.su-top p{margin:4px 0 14px;color:var(--ink-2);font-size:13px}
.su-steps{display:flex;gap:6px;flex-wrap:wrap}
.su-steps button{border:.5px solid var(--hair-2);background:#fff;border-radius:999px;padding:4px 12px 4px 6px;font-size:12.5px;color:var(--ink-3);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.su-steps button b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--mist);font:600 11px/1 var(--f-data);color:var(--ink-2)}
.su-steps button.on{border-color:var(--cobalt);color:var(--cobalt)}
.su-steps button.on b{background:var(--cobalt);color:#fff}
.su-steps button.done b{background:var(--p4);color:#fff}
.su-steps button:disabled{cursor:default;opacity:.55}
.su-body{flex:1;min-height:0;overflow:auto;padding:18px 24px 8px}
.su-body h4{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-size:12.5px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.su-body h4:first-child{margin-top:0}
.su-hint{margin:4px 0 10px;color:var(--ink-3);font-size:12.5px;line-height:1.45}
.su-f{display:block;margin:0 0 10px}
.su-f>span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.su input[type=text],.su input[type=search]{width:100%;height:34px;border:.5px solid var(--hair-2);border-radius:8px;padding:0 10px;background:#fff}
.su input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.su-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px;max-height:240px;overflow:auto;padding:2px}
.su-opt{display:flex;align-items:center;gap:10px;text-align:left;border:.5px solid var(--hair-2);background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer;min-width:0}
.su-opt:hover{border-color:var(--cobalt)}
.su-opt.on{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt-soft);background:#F7F9FF}
.su-opt i{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--hair-2);font-style:normal}
.su-opt.on i{border:4px solid var(--cobalt)}
.su-opt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-opt small{display:block;color:var(--ink-3);font-size:11.5px}
.su-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.su-chip{display:inline-flex;align-items:center;gap:7px;border:.5px solid var(--hair-2);background:#fff;border-radius:999px;padding:3px 10px 3px 3px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.su-chip.add{color:var(--ink-2);padding-left:9px}
.su-chip.add:hover{border-color:var(--cobalt);color:var(--cobalt)}
.su-chip .av{width:22px;height:22px}.su-chip .av.ini{font-size:9px}
.su-chip em{font-style:normal;color:var(--ink-3)}
.su-chip x{color:var(--ink-3);font-weight:700}
.su-chs{display:grid;gap:10px}
.su-ch{border:.5px solid var(--hair-2);border-radius:11px;padding:10px 12px;background:#fff}
.su-ch.on{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt-soft)}
.su-ch-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.su-ch-h .dot{flex:none;width:12px;height:12px;border-radius:50%;cursor:pointer}
.su-ch-h input{max-width:240px}
.su-n{margin-left:auto;font:500 12.5px var(--f-data);color:var(--cobalt);white-space:nowrap}
.su-n.zero{color:var(--p1)}
.su-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.su-grid .su-f{margin:0}
.su-x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.su-x:hover{background:var(--mist);color:var(--ink)}
.su-cands{display:grid;gap:8px}
.su-cands>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.su-cands>div>b{font-size:12px;font-weight:600;color:var(--ink-2);min-width:96px}
.su-other{margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.su-ta{display:block;width:100%;min-height:96px;resize:vertical;border:.5px solid var(--hair-2);border-radius:8px;padding:8px 10px;background:#fff;
  font:12.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink)}
.su-ta:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.su-ch-h b{font:500 14px var(--f-data)}
.su-sum{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:13px}
.su-sum dt{color:var(--ink-3)}.su-sum dd{margin:0}
.su-bot{flex:none;display:flex;align-items:center;gap:8px;padding:12px 24px;border-top:.5px solid var(--hair)}
.su-bot .su-err{flex:1;color:var(--p1);font-size:12.5px}
.su-bot .tb.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.su-bot .tb.primary:hover{background:#1B36D9}
@media (max-width:700px){.su-grid{grid-template-columns:1fr}.setup{padding:8px}}

@media (max-width:1280px){.search{width:200px}}
@media (max-width:900px){
  body{overflow:auto}
  .top{height:auto;flex-wrap:wrap;padding:10px 12px;gap:10px 12px}
  .sep,.grow{display:none}.search{width:100%;order:9}
  .bay{flex:0 0 86vw;max-width:none}
}
/* Motion follows the OS setting unless the person turns it on or off with the motion button. */
@media (prefers-reduced-motion:reduce){html:not([data-motion="on"]) *{transition:none!important;animation:none!important}}
html[data-motion="off"] *{transition:none!important;animation:none!important}

function has(list,id){return (list||[]).some(function(p){return p&&p.id===id})}

var chans=store.get('sfb.chan',{});
function chanOf(r){return r.channels&&r.channels.length?r.channels:['other']}
function chanFor(u){var on=(chans[u]||[]).filter(function(c){return CHAN_IDS.indexOf(c)>=0});return on.length?on:CHAN_IDS.slice()}
function inChan(r,u){if(!CHANS.length)return true;var on=chanFor(u);return chanOf(r).some(function(c){return on.indexOf(c)>=0})}
/* Column rules, keyed by the selected person. The server already matched status and issue type (r.cols). */
function fits(c,r,u){
  var R=c.rule,mine=!!(r.assignee&&r.assignee.id===u),own=R.type==='unassigned'&&R.orAssignee&&mine;
  /* The person's own tickets are not filtered by channel, as in the assignee columns. */
  if(c.channels&&!own&&!inChan(r,u))return false;
  if(R.type==='unassigned')return !r.assignee||own;
  if(R.type==='assignee')return mine;
  if(R.type==='any')return true;
  if(R.type==='involved')return mine||(R.roles||ROLES.map(function(x){return x.id})).some(function(id){return has(roleList(r,id),u)});
  if(R.notAssignee&&mine)return false;
  var list=roleList(r,R.role);
  if(list.length)return has(list,u);
  if(R.whenEmpty==='nobody')return false;
  return !(R.emptyExcludes||[]).some(function(id){return has(roleList(r,id),u)});
}
/* 1 when the ticket already names the person for this column (its role, or the assignee), so it sorts first. */
function claimed(c,r,u){
  var R=c.rule;
  if(R.type==='role')return has(roleList(r,R.role),u)?1:0;
  if(R.type==='involved')return (r.assignee&&r.assignee.id===u)||(R.roles||ROLES.map(function(x){return x.id})).some(function(id){return has(roleList(r,id),u)})?1:0;
  return r.assignee&&r.assignee.id===u?1:0;
}

function joinList(list,word){return list.length<2?list.join(''):list.slice(0,-1).join(', ')+word+list[list.length-1]}
function inSentence(l){return lang==='en'?l.toLowerCase():l}
function sentenceCase(l){return lang==='en'?l.charAt(0).toUpperCase()+l.slice(1).toLowerCase():l}
function ruleText(c){
  if(c.description)return txt(c.description);
  var t=T[lang],x=t.r,R=c.rule,p=[];
  var chanNote=c.channels&&CHANS.length;
  if(R.type==='unassigned'&&R.orAssignee){p.push(chanNote?x.unassignedChanOrMine:x.unassignedOrMine);chanNote=false}
  else if(R.type==='unassigned')p.push(x.unassigned);
  else if(R.type==='assignee')p.push(x.assignee);
  else if(R.type==='any')p.push(x.any);
  else if(R.type==='involved')p.push(x.involved(joinList([inSentence(t.rA)].concat((R.roles||ROLES.map(function(y){return y.id})).map(roleLabel).filter(Boolean).map(inSentence)),t.or)));
  else{
    if(R.notAssignee)p.push(x.notMine);
    var l=roleLabel(R.role),ex=(R.emptyExcludes||[]).map(roleLabel).filter(Boolean).map(inSentence);
    if(l)p.push(R.whenEmpty==='nobody'?x.roleOnly(sentenceCase(l)):ex.length?x.roleOrEmptyNot(sentenceCase(l),joinList(ex,t.or)):x.roleOrEmpty(sentenceCase(l)));
    else if(ex.length)p.push(x.notRole(joinList(ex,t.or)));
    else if(!R.notAssignee)p.push(x.any);
  }
  if(chanNote)p.push(x.channels);
  if(c.types&&c.types.length)p.push(c.types.join(', ')+'.');
  return p.join(' ');
}

  if(!W)return;
  [].forEach.call(document.querySelectorAll('[data-su-step]'),function(b){b.disabled=!canGo(+b.dataset.suStep)});
  var n=document.querySelector('[data-su="next"]');if(n)n.disabled=!canGo(W.step+1);
}

function stepSprint(){var t=ST[lang];
  return '<h4>'+h(t.boardH)+'</h4><input type="search" id="suBoardQ" placeholder="'+h(t.boardPh)+'" value="'+h(W.boardQ)+'" autocomplete="off">'+
    '<div class="su-list" id="suBoards" style="margin-top:8px"></div><h4>'+h(t.sprintH)+'</h4><div class="su-list" id="suSprints"></div>'+
    '<label class="su-f" style="margin-top:14px"><span>'+h(t.prefix)+'</span><input type="text" id="suPrefix" value="'+h(W.prefix)+'" autocomplete="off" spellcheck="false"></label>'+
    '<p class="su-hint" id="suPrefixHint"></p>';
}
function loadBoards(q){api('boards?q='+encodeURIComponent(q)).then(function(b){if(W&&W.boardQ===q){W.boards=b;fillBoards()}}).catch(fail)}
function loadSprints(keep){
  var b=W.board;
  api('sprints?board='+b.id).then(function(s){
    if(!W||W.board!==b)return;W.sprints=s;
    var m=keep?prefixMatch():null;if(!m&&s.length===1)m=s[0];if(m)chooseSprint(m,keep);
    fillSprints();updateNav();
  }).catch(function(e){if(W&&W.board===b){W.sprints=[];fillSprints()}fail(e)});
}
function prefixMatch(){var s=W.sprints||[];for(var i=0;i<s.length;i++)if(s[i].name.indexOf(W.prefix)===0)return s[i];return null}
function chooseSprint(s,keep){
  if(!W.sprint||W.sprint.id!==s.id){W.facts=null;W.preview=null}
  W.sprint=s;if(!keep)W.prefix=s.prefix;var p=$('suPrefix');if(p)p.value=W.prefix;
}
function fillBoards(){
  var t=ST[lang],el=$('suBoards');if(!el)return;
  if(!W.boards){el.innerHTML='<p class="su-hint">'+h(t.loading)+'</p>';return}
  var list=W.boards.slice();if(W.board&&!list.some(function(b){return b.id===W.board.id}))list.unshift(W.board);
  el.innerHTML=list.length?list.map(function(b){return '<button type="button" class="su-opt'+(W.board&&W.board.id===b.id?' on':'')+'" data-su-board="'+b.id+'"><i></i><span>'+h(b.name)+
    '<small>'+h((b.project?b.project+' · ':'')+'#'+b.id)+'</small></span></button>'}).join(''):'<p class="su-hint">'+h(t.noBoards)+'</p>';
}
function shortDay(s){return s?new Date(s).toLocaleDateString(lang==='tr'?'tr-TR':'en-GB',{day:'numeric',month:'short'}):''}
function fillSprints(){
  var t=ST[lang],el=$('suSprints');if(!el)return;
  if(!W.board)el.innerHTML='<p class="su-hint">'+h(t.pickBoard)+'</p>';
  else if(!W.sprints)el.innerHTML='<p class="su-hint">'+h(t.loading)+'</p>';
  else if(!W.sprints.length)el.innerHTML='<p class="su-hint">'+h(t.noSprint)+'</p>';
  else el.innerHTML=W.sprints.map(function(s){return '<button type="button" class="su-opt'+(W.sprint&&W.sprint.id===s.id?' on':'')+'" data-su-sprint="'+s.id+'"><i></i><span>'+h(s.name)+
    '<small>'+h(shortDay(s.startDate)+' – '+shortDay(s.endDate))+'</small></span></button>'}).join('');
  fillPrefixHint();
}
function fillPrefixHint(){var el=$('suPrefixHint');if(!el)return;var m=W.sprints?prefixMatch():null;el.textContent=W.sprints?ST[lang].prefixHint(W.prefix,m&&m.name):''}

function ensureFacts(){
  if(!W.sprint||W.facts||W.factsFor===W.sprint.id)return;
  var sid=W.sprint.id;W.factsFor=sid;
  api('sprint?sprint='+sid).then(function(f){
    if(!W||!W.sprint||W.sprint.id!==sid)return;W.facts=f;f.people.forEach(function(p){W.known[p.id]=p});
    if(W.step===1){fillSprintPeople();fillTeam()}if(W.step===2){fillCands();schedulePreview()}
  }).catch(function(e){if(W)W.factsFor=null;fail(e)});
}
function stepTeam(){var t=ST[lang];
  return '<p class="su-hint">'+h(t.teamHint)+'</p><div class="su-chips" id="suTeam"></div>'+
    '<h4>'+h(t.fromSprint)+'<button type="button" class="tb" data-su="addall" style="height:26px;font-size:12px">'+h(t.addAll)+'</button></h4><div class="su-chips" id="suSprintPeople"></div>'+
    '<h4>'+h(t.findH)+'</h4><input type="search" id="suUserQ" placeholder="'+h(t.findPh)+'" value="'+h(W.userQ)+'" autocomplete="off"><div class="su-chips" id="suUsers" style="margin-top:8px"></div>';
}
function inTeam(id){return W.team.some(function(p){return p.id===id})}
function chip(p,attr,add){return '<button type="button" class="su-chip'+(add?' add':'')+'" '+attr+'="'+h(p.id)+'">'+(add?'+ ':'')+avatar(p)+h(p.name||p.id)+(add?'':' <x aria-hidden="true">×</x>')+'</button>'}
function fillTeam(){var el=$('suTeam');if(el)el.innerHTML=W.team.length?W.team.map(function(p){return chip(p,'data-su-rm')}).join(''):'<p class="su-hint">'+h(ST[lang].emptyTeam)+'</p>'}
function fillSprintPeople(){
  var el=$('suSprintPeople');if(!el)return;
  if(!W.facts){el.innerHTML='<p class="su-hint">'+h(ST[lang].loading)+'</p>';return}
  el.innerHTML=W.facts.people.filter(function(p){return !inTeam(p.id)}).map(function(p){return chip(p,'data-su-add',true)}).join('');
}
function fillUsers(){
  var el=$('suUsers');if(!el)return;
  if(W.userQ.trim().length<2){el.innerHTML='';return}
  var list=W.users.filter(function(p){return !inTeam(p.id)});
  el.innerHTML=list.length?list.map(function(p){return chip(p,'data-su-add',true)}).join(''):W.users.length?'':'<p class="su-hint">'+h(ST[lang].noUsers)+'</p>';
}

function stepChannels(){var t=ST[lang];
  var o='<p class="su-hint">'+h(t.chanHint)+'</p><div class="seg" role="group"><button type="button" data-su-chan="0" aria-pressed="'+!W.useChan+'">'+h(t.chanNo)+
    '</button><button type="button" data-su-chan="1" aria-pressed="'+W.useChan+'">'+h(t.chanYes)+'</button></div>';
  if(!W.useChan)return o+'<p class="su-hint" style="margin-top:12px">'+h(t.noChanNote)+'</p>';
  return o+'<p class="su-hint" style="margin-top:12px">'+h(t.ruleHint)+'</p><div class="su-chs" id="suChans">'+W.chans.map(chanCard).join('')+'</div>'+
    '<button type="button" class="tb" data-su="addch" style="margin-top:10px">+ '+h(t.addChan)+'</button><p class="su-other" id="suOther"></p>'+
    '<h4>'+h(t.cands)+'</h4><div class="su-cands" id="suCands"></div>';
}
function chanCard(c,i){
  var t=ST[lang];
  function f(k,label){return '<label class="su-f"><span>'+h(label)+'</span><input type="text" data-su-k="'+k+'" data-su-i="'+i+'" value="'+h(c[k])+'" autocomplete="off" spellcheck="false"></label>'}
  return '<div class="su-ch'+(i===W.active?' on':'')+'" data-su-ch="'+i+'"><div class="su-ch-h"><i class="dot" style="background:'+h(c.color)+'" data-su-color="'+i+'" title="'+h(t.color)+'"></i>'+
    '<input type="text" data-su-k="name" data-su-i="'+i+'" value="'+h(c.name)+'" placeholder="'+h(t.name)+'" aria-label="'+h(t.name)+'"><span class="su-n" id="suN'+i+'"></span>'+
    '<button type="button" class="su-x" data-su-rmch="'+i+'" title="'+h(t.removeChan)+'" aria-label="'+h(t.removeChan)+'">×</button></div>'+
    '<div class="su-grid">'+f('epics',t.epics)+f('keywords',t.keywords)+f('labels',t.labels)+f('components',t.components)+(c.summary?f('summary',t.regex):'')+'</div></div>';
}
function addChan(){W.chans.push(chanDraft({},W.chans.length));W.active=W.chans.length-1}
function fillCands(){
  var t=ST[lang],el=$('suCands');if(!el)return;
  if(!W.facts){el.innerHTML='<p class="su-hint">'+h(t.loading)+'</p>';return}
  function row(title,items,k,text){return items.length?'<div><b>'+h(title)+'</b>'+items.map(function(x){var v=k==='epics'?x.key:x.name;
    return '<button type="button" class="su-chip add" data-su-cand="'+k+'" data-v="'+h(v)+'" title="'+h(text(x))+'">'+h(text(x).length>48?text(x).slice(0,46)+'…':text(x))+' <em>'+x.n+'</em></button>'}).join('')+'</div>':''}
  var f=W.facts,o=row(t.epics,f.epics.slice(0,15),'epics',function(x){return x.key+' '+x.summary})+row(t.labels,f.labels.slice(0,24),'labels',function(x){return x.name})+
    row(t.components,f.components.slice(0,24),'components',function(x){return x.name});
  el.innerHTML=o||'<p class="su-hint">'+h(t.noCands)+'</p>';
}
function chanPayload(){
  var used={};
  return W.chans.map(function(c,i){
    if(!c.id){var id=slug(c.name)||'channel-'+(i+1);while(used[id]||id==='other'||W.chans.some(function(x,j){return j!==i&&x.id===id}))id+='-'+(i+1);c.id=id}
    used[c.id]=1;
    var o={id:c.id,name:c.name.trim()||c.id,color:c.color,epics:split(c.epics),labels:split(c.labels),components:split(c.components),keywords:split(c.keywords)};
    if(c.summary.trim())o.summary=c.summary.trim();return o;
  });
}
var pvTimer;function schedulePreview(){clearTimeout(pvTimer);pvTimer=setTimeout(runPreview,350)}
function runPreview(){
  if(!W||!W.useChan||!W.sprint||W.step!==2)return;
  api('preview',{sprint:W.sprint.id,channels:chanPayload()}).then(function(p){if(!W)return;W.preview=p;setErr('');fillCounts()}).catch(fail);
}
function fillCounts(){
  var t=ST[lang],p=W.preview;if(!p)return;
  W.chans.forEach(function(c,i){var el=$('suN'+i),m=p.matches[c.id];if(!el||!m)return;el.textContent=t.matches(m.n,p.total);el.classList.toggle('zero',!m.n);el.title=m.keys.join(', ')});
  var o=$('suOther');if(o)o.textContent=t.other(p.matches.other.n,p.total);
}

function stepPrompts(){var t=ST[lang];
  var o='<p class="su-hint">'+h(t.promptHint)+'</p><div class="seg" role="group" aria-label="'+h(t.editLang)+'">'+['en','tr'].map(function(l){
    return '<button type="button" data-su-plang="'+l+'" aria-pressed="'+(W.plang===l)+'">'+h(t.langName[l])+'</button>'}).join('')+'</div>';
  return o+COLS.map(function(c){var p=W.prompts[c.id];
    return '<div class="su-ch" style="margin-top:12px"><div class="su-ch-h"><i class="dot" style="background:'+h(c.color)+'"></i><b>'+h(c.name)+'</b><span class="su-n"></span>'+
      '<button type="button" class="tb" data-su-reset="'+h(c.id)+'" style="height:26px;font-size:12px">'+h(t.reset)+'</button></div>'+promptArea(c.id,'prompt')+
      (p.promptIfNotAssignee!=null?'<p class="su-hint" style="margin-top:8px">'+h(t.whenOther)+'</p>'+promptArea(c.id,'promptIfNotAssignee'):'')+'</div>'}).join('');
}
function ptext(v){return v==null?'':typeof v==='string'?v:(v[W.plang]!=null?v[W.plang]:v.en||'')}
function promptArea(id,k){return '<textarea class="su-ta" data-su-p="'+h(id)+'" data-su-pk="'+k+'" rows="4" spellcheck="false" aria-label="'+h(id+' '+k)+'">'+h(ptext(W.prompts[id][k]))+'</textarea>'}
function setPrompt(id,k,text){var cur=W.prompts[id][k];if(cur==null||typeof cur==='string')W.prompts[id][k]=text;else{cur=clone(cur);cur[W.plang]=text;W.prompts[id][k]=cur}}
function changedPrompts(){
  var out={};COLS.forEach(function(c){var p=W.prompts[c.id];
    if(JSON.stringify(p.prompt)!==JSON.stringify(c.defaultPrompt)||JSON.stringify(p.promptIfNotAssignee)!==JSON.stringify(c.defaultPromptIfNotAssignee))out[c.id]=p});
  return out;
}

function stepRefresh(){
  var t=ST[lang],opts=[30,60,120,300,600];if(opts.indexOf(W.refresh)<0)opts.push(W.refresh);opts.sort(function(a,b){return a-b});
  var m=prefixMatch(),chans=W.useChan?W.chans.length:0;
  return '<h4>'+h(t.refreshH)+'</h4><p class="su-hint">'+h(t.refreshHint)+'</p><div class="seg" role="group">'+opts.map(function(s){
      return '<button type="button" data-su-refresh="'+s+'" aria-pressed="'+(W.refresh===s)+'">'+h(t.every(s))+'</button>'}).join('')+'</div>'+
    '<h4>'+h(t.sumH)+'</h4><dl class="su-sum"><dt>'+h(t.sBoard)+'</dt><dd>'+h(W.board?W.board.name+' (#'+W.board.id+')':'–')+'</dd>'+
    '<dt>'+h(t.sSprint)+'</dt><dd>'+h(t.prefixHint(W.prefix,m&&m.name))+'</dd><dt>'+h(t.sTeam)+'</dt><dd>'+h(t.nPeople(W.team.length))+'</dd>'+
    '<dt>'+h(t.sChan)+'</dt><dd>'+h(t.nChan(chans))+'</dd><dt>'+h(t.sPrompts)+'</dt><dd>'+h(t.nPrompts(Object.keys(changedPrompts()).length))+'</dd>'+
    '<dt>'+h(t.refreshH)+'</dt><dd>'+h(t.every(W.refresh))+'</dd></dl>';
}
function saveSetup(){
  var t=ST[lang];W.busy=true;W.error='';renderSetup();
  var chans=W.useChan?chanPayload().filter(function(c,i){var d=W.chans[i];return d.name.trim()||d.epics||d.labels||d.components||d.keywords||d.summary}):[];
  api('save',{board:{id:W.board.id,sprintNamePrefix:W.prefix},team:W.team,channels:chans,prompts:changedPrompts(),refreshSeconds:W.refresh})
    .then(function(){location.reload()})
    .catch(function(e){if(!W)return;W.busy=false;W.error=t.err+': '+e.message;renderSetup()});
}

document.addEventListener('click',function(e){
  if(!W||!e.target.closest('#setup'))return;
  var b=e.target.closest('[data-su]'),a=b&&b.dataset.su,x;
  if(a==='cancel'){closeSetup();return}
  if(a==='back'){W.step--;W.error='';renderSetup();return}
  if(a==='next'){if(canGo(W.step+1)){W.step++;W.error='';renderSetup()}return}
  if(a==='save'){if(W.board&&W.sprint)saveSetup();return}
  if(a==='addall'&&W.facts){W.facts.people.forEach(function(p){if(!inTeam(p.id))W.team.push(p)});fillTeam();fillSprintPeople();fillUsers();return}
  if(a==='addch'){addChan();renderSetup();return}
  if((x=e.target.closest('[data-su-step]'))&&!x.disabled){W.step=+x.dataset.suStep;W.error='';renderSetup();return}
  if(x=e.target.closest('[data-su-board]')){var id=+x.dataset.suBoard,row=(W.boards||[]).concat(W.board?[W.board]:[]).filter(function(r){return r.id===id})[0];
    if(row&&(!W.board||W.board.id!==id)){W.board=row;W.sprints=null;W.sprint=null;W.facts=null;W.factsFor=null;W.preview=null;fillBoards();fillSprints();updateNav();loadSprints(false)}return}
  if(x=e.target.closest('[data-su-sprint]')){var sid=+x.dataset.suSprint;(W.sprints||[]).forEach(function(s){if(s.id===sid)chooseSprint(s,false)});fillSprints();updateNav();return}
  if(x=e.target.closest('[data-su-add]')){var p=W.known[x.dataset.suAdd];if(p&&!inTeam(p.id))W.team.push(p);fillTeam();fillSprintPeople();fillUsers();return}
  if(x=e.target.closest('[data-su-rm]')){W.team=W.team.filter(function(p){return p.id!==x.dataset.suRm});fillTeam();fillSprintPeople();fillUsers();return}
  if(x=e.target.closest('[data-su-chan]')){W.useChan=x.dataset.suChan==='1';if(W.useChan&&!W.chans.length)addChan();renderSetup();return}
  if(x=e.target.closest('[data-su-rmch]')){W.chans.splice(+x.dataset.suRmch,1);W.active=Math.max(0,Math.min(W.active,W.chans.length-1));renderSetup();return}
  if(x=e.target.closest('[data-su-color]')){var c=W.chans[+x.dataset.suColor];c.color=PAL[(PAL.indexOf(c.color)+1)%PAL.length];x.style.background=c.color;return}
  if(x=e.target.closest('[data-su-cand]')){
    if(!W.chans.length){addChan();renderSetup()}
    var k=x.dataset.suCand,v=x.dataset.v,ch=W.chans[W.active],vals=split(ch[k]);
    if(vals.indexOf(v)<0){vals.push(v);ch[k]=vals.join(', ');var inp=document.querySelector('[data-su-k="'+k+'"][data-su-i="'+W.active+'"]');if(inp)inp.value=ch[k];schedulePreview()}
    return}
  if(x=e.target.closest('[data-su-plang]')){W.plang=x.dataset.suPlang;renderSetup();return}
  if(x=e.target.closest('[data-su-reset]')){var col=COLMAP[x.dataset.suReset];W.prompts[col.id]={prompt:clone(col.defaultPrompt),promptIfNotAssignee:clone(col.defaultPromptIfNotAssignee)};renderSetup();return}
  if(x=e.target.closest('[data-su-refresh]')){W.refresh=+x.dataset.suRefresh;renderSetup();return}
  if(x=e.target.closest('[data-su-ch]'))setActiveChan(+x.dataset.suCh);
});
function setActiveChan(i){if(W.active===i)return;W.active=i;[].forEach.call(document.querySelectorAll('[data-su-ch]'),function(el){el.classList.toggle('on',+el.dataset.suCh===i)})}
var boardT,userT;
document.addEventListener('input',function(e){
  if(!W||!e.target.closest('#setup'))return;
  var el=e.target;
  if(el.id==='suBoardQ'){W.boardQ=el.value;clearTimeout(boardT);boardT=setTimeout(function(){loadBoards(W.boardQ)},300);return}
  if(el.id==='suPrefix'){W.prefix=el.value;fillPrefixHint();return}
  if(el.id==='suUserQ'){W.userQ=el.value;clearTimeout(userT);var q=el.value.trim();if(q.length<2){W.users=[];fillUsers();return}
    userT=setTimeout(function(){api('users?q='+encodeURIComponent(q)).then(function(u){if(!W||W.userQ.trim()!==q)return;u.forEach(function(p){W.known[p.id]=p});W.users=u;fillUsers()}).catch(fail)},300);return}
  if(el.dataset.suK){var c=W.chans[+el.dataset.suI];if(c){c[el.dataset.suK]=el.value;setActiveChan(+el.dataset.suI);schedulePreview()}return}
  if(el.dataset.suP)setPrompt(el.dataset.suP,el.dataset.suPk,el.value);
});
document.addEventListener('focusin',function(e){var c=W&&e.target.closest&&e.target.closest('[data-su-ch]');if(c)setActiveChan(+c.dataset.suCh)});
$('settings').addEventListener('click',function(){openSetup(false)});

skeleton();renderChrome();
if(SETUP.required)openSetup(true);else playShow(load(false));
})();
</script>
</body>
